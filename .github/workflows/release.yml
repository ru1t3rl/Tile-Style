name: Release Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish application
        run: dotnet publish TileStyle/TileStyle.csproj --configuration Release --output ./publish --no-build /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Generate changelog
        id: changelog
        run: |
          $lastTag = git describe --tags --abbrev=0 2>$null
          if ($lastTag) {
            $changelog = git log --pretty=format:"- %s (%h)" "$lastTag..HEAD"
          } else {
            $changelog = git log --pretty=format:"- %s (%h)" -n 20
          }
          if ([string]::IsNullOrWhiteSpace($changelog)) {
            $changelog = "- Initial release"
          }
          $changelog = $changelog -replace "`r`n", "%0A" -replace "`n", "%0A"
          echo "CHANGELOG=$changelog" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath TileStyle-${{ steps.gitversion.outputs.semVer }}.zip
        shell: pwsh

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Preview v${{ steps.gitversion.outputs.semVer }}
          body: |
            ## 🚀 Preview Release v${{ steps.gitversion.outputs.semVer }}
            
            This is an automated pre-release build from the `develop` branch.
            
            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            **Build Information:**
            - Version: ${{ steps.gitversion.outputs.fullSemVer }}
            - Commit: ${{ steps.gitversion.outputs.sha }}
            - Branch: ${{ github.ref_name }}
          files: TileStyle-${{ steps.gitversion.outputs.semVer }}.zip
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}