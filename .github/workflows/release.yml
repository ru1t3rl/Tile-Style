name: Release Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a pre-release'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for GitVersion
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            **/bin/Release/**
            **/obj/Release/**
          retention-days: 1

      - name: Set version output
        id: version
        run: echo "semver=${{ steps.gitversion.outputs.semVer }}" >> $env:GITHUB_OUTPUT
        shell: pwsh
    
    outputs:
      version: ${{ steps.version.outputs.semver }}

  test:
    needs: build
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  publish:
    needs: [build, test]
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish application
        run: dotnet publish src/TileStyle.Core/TileStyle.Core.csproj --configuration Release --output ./publish /p:Version=${{ needs.build.outputs.version }}

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath TileStyle-${{ needs.build.outputs.version }}.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: TileStyle-${{ needs.build.outputs.version }}
          path: TileStyle-${{ needs.build.outputs.version }}.zip
          retention-days: 7

  release:
    needs: [build, publish]
    runs-on: windows-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TileStyle-${{ needs.build.outputs.version }}

      - name: Generate changelog
        id: changelog
        run: |
          $lastTag = git describe --tags --abbrev=0 2>$null
          if ($lastTag) {
            $changelog = git log --pretty=format:"- %s (%h)" "$lastTag..HEAD"
          } else {
            $changelog = git log --pretty=format:"- %s (%h)" -n 20
          }
          if ([string]::IsNullOrWhiteSpace($changelog)) {
            $changelog = "- Initial release"
          }
          $changelog = $changelog -replace "`r`n", "%0A" -replace "`n", "%0A"
          echo "CHANGELOG=$changelog" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Preview v${{ needs.build.outputs.version }}
          body: |
            ## 🚀 Preview Release v${{ needs.build.outputs.version }}
            
            This is an automated pre-release build from the `develop` branch.
            
            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            **Build Information:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
          files: TileStyle-${{ needs.build.outputs.version }}.zip
          prerelease: true
          draft: false